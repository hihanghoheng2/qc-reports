<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>QC Reports</title>
  <style>
    :root{color-scheme:light dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1220;color:#e8eef9;padding:24px}.card{width:min(680px,100%);border:1px solid #26344e;border-radius:16px;background:#111c2f;padding:32px;box-shadow:0 18px 50px rgba(0,0,0,.24)}h1{margin:0 0 10px;font-size:28px}p{margin:0;color:#aebbd2;line-height:1.7}.status{display:inline-flex;margin-top:22px;padding:7px 11px;border:1px solid #31527f;border-radius:999px;color:#bcd6ff;font-size:13px;font-weight:700}@media(prefers-color-scheme:light){body{background:#f5f7fb;color:#172033}.card{background:#fff;border-color:#dce3ef;box-shadow:0 18px 50px rgba(24,40,72,.08)}p{color:#5d687a}.status{color:#245a99;border-color:#b9d2ef}}
  </style>
</head>
<body>
  <main class="card">
    <h1>QC Reports</h1>
    <p>Halaman publik untuk report yang dipublish dari AlgoQC. Report HTML dan Markdown akan muncul setelah dipublish dari Admin → Markdown.</p>
    <span class="status">Publisher ready</span>
  </main>
</body>
</html>
